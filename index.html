<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster DIY</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee;margin:0;padding:24px;text-align:center}
  h1{font-size:1.2rem;margin:0 0 8px;color:#1db954}
  #status{font-size:1.6rem;word-break:break-word;font-weight:700;margin:36px 0;min-height:4rem}
  button,select,input{font-size:1.05rem;padding:12px 16px;border-radius:10px;border:0;margin:6px}
  button{background:#1db954;color:#000;font-weight:600}
  button.sec{background:#2d2d2d;color:#eee}
  .box{background:#1b1b1b;border-radius:14px;padding:16px;margin:20px auto;max-width:420px;text-align:left}
  label{display:block;margin:12px 0 4px;font-size:.85rem;color:#999}
  select,input{width:100%;box-sizing:border-box;background:#2a2a2a;color:#eee;margin:0}
  #solution{margin-top:14px;color:#bbb;min-height:1.5rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<h1>🎵 Hitster DIY</h1>
<div id="status">Lade…</div>

<div id="controls" hidden>
  <button id="again" class="sec">↺ Nochmal</button>
  <button id="other" class="sec">🎲 Andere Stelle</button>
  <button id="stop" class="sec">⏹ Stop</button>
  <div><button id="reveal" class="sec">Auflösung zeigen</button></div>
  <div id="solution"></div>
</div>

<div id="login" hidden>
  <button id="loginBtn">Mit Spotify verbinden</button>
  <div><button id="resetCid2" class="sec">Client ID ändern</button></div>
</div>

<div class="box" id="settings" hidden>
  <label for="mode">Startpunkt</label>
  <select id="mode">
    <option value="random">Zufällige Stelle</option>
    <option value="highlight">Bekannte Stelle (wenn hinterlegt, sonst zufällig)</option>
    <option value="start">Vom Anfang</option>
  </select>
  <label for="clip">Abspieldauer in Sekunden (0 = bis zum Ende)</label>
  <input id="clip" type="number" min="0" step="5">
  <label for="device">Wiedergabegerät</label>
  <select id="device"></select>
  <button id="refresh" class="sec">Geräte neu laden</button>
  <button id="resetCid" class="sec">Client ID ändern</button>
</div>

<div class="box" id="setup" hidden>
  <label>1. Diese Redirect URI in der Spotify-App eintragen:</label>
  <div id="uri" style="word-break:break-all;background:#2a2a2a;padding:10px;border-radius:8px;user-select:all"></div>
  <label for="cid">2. Client ID aus dem Spotify-Dashboard einfügen:</label>
  <input id="cid" placeholder="z. B. 1a2b3c…" autocomplete="off">
  <button id="saveCid">Speichern</button>
</div>

<script>
// Nichts anpassen nötig: Client ID wird auf der Seite eingegeben,
// Redirect URI ergibt sich aus der Adresse dieser Seite.
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");
let CLIENT_ID = "";

const SCOPES = "user-modify-playback-state user-read-playback-state";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const setStatus = t => { $("status").textContent = t; };

function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function login(){
  const rnd = new Uint8Array(64);
  crypto.getRandomValues(rnd);
  const verifier = b64url(rnd);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("verifier", verifier);
  if (location.hash) store.set("pending", location.hash);
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: "S256", code_challenge: challenge
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}

async function tokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams({client_id: CLIENT_ID, ...params})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || "Token-Fehler");
  store.set("access", j.access_token);
  store.set("expires", String(Date.now() + (j.expires_in - 60) * 1000));
  if (j.refresh_token) store.set("refresh", j.refresh_token);
}

async function getToken(){
  const acc = store.get("access", null);
  if (acc && Date.now() < +store.get("expires", "0")) return acc;
  const rt = store.get("refresh", null);
  if (!rt) return null;
  try { await tokenRequest({grant_type: "refresh_token", refresh_token: rt}); return store.get("access", null); }
  catch(e){ store.del("refresh"); store.del("access"); return null; }
}

async function api(method, path, body){
  const t = await getToken();
  if (!t) { const e = new Error("LOGIN"); e.login = true; throw e; }
  const r = await fetch("https://api.spotify.com/v1" + path, {
    method,
    headers: Object.assign({Authorization: "Bearer " + t}, body ? {"Content-Type": "application/json"} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok){
    const err = new Error((j && j.error && (j.error.message || j.error)) || ("HTTP " + r.status));
    err.status = r.status; err.reason = j && j.error && j.error.reason;
    if (r.status === 401) err.login = true;
    throw err;
  }
  return j;
}

let current = null, stopTimer = null;

function randomPos(dur, clipSec){
  const lo = dur * 0.15;
  const tail = (clipSec > 0 ? clipSec * 1000 : 30000) + 5000;
  const hi = Math.max(lo, Math.min(dur * 0.75, dur - tail));
  return lo + Math.random() * (hi - lo);
}

async function play(forcePos){
  if (!current) return;
  clearTimeout(stopTimer);
  if (!current.info){
    current.info = await api("GET", "/tracks/" + current.id);
    current.duration = current.info.duration_ms;
  }
  const clip = +store.get("clip", "30") || 0;
  const mode = store.get("mode", "random");
  const d = current.duration;
  let pos;
  if (forcePos !== undefined) pos = forcePos;
  else if (mode === "start") pos = 0;
  else if (mode === "highlight" && current.start !== null) pos = current.start * 1000;
  else pos = randomPos(d, clip);
  pos = Math.floor(Math.max(0, Math.min(pos, d - 5000)));
  current.lastPos = pos;

  const body = {uris: ["spotify:track:" + current.id], position_ms: pos};
  const dev = store.get("device", "");
  try {
    await api("PUT", "/me/player/play" + (dev ? "?device_id=" + encodeURIComponent(dev) : ""), body);
  } catch(e){
    if (dev && e.status === 404){ store.del("device"); $("device").value = ""; await api("PUT", "/me/player/play", body); }
    else throw e;
  }
  setStatus("▶ Läuft – welches Jahr?");
  if (clip > 0){
    stopTimer = setTimeout(() => {
      api("PUT", "/me/player/pause").catch(() => {});
      setStatus("⏹ Zeit um – welches Jahr?");
    }, clip * 1000);
  }
}

function showError(e){
  if (e.login){ $("login").hidden = false; setStatus("Bitte (neu) mit Spotify verbinden"); return; }
  if (e.reason === "NO_ACTIVE_DEVICE" || e.status === 404)
    setStatus("Kein Gerät aktiv: Spotify auf dem Lautsprecher-Gerät öffnen, kurz was abspielen, dann ↺ Nochmal");
  else if (e.reason === "PREMIUM_REQUIRED" || e.status === 403)
    setStatus("Spotify Premium nötig (oder Zugriff verweigert)");
  else setStatus("Fehler: " + e.message);
}

async function loadDevices(){
  const sel = $("device");
  sel.innerHTML = "";
  const def = document.createElement("option");
  def.value = ""; def.textContent = "Aktuell aktives Gerät";
  sel.appendChild(def);
  try {
    const j = await api("GET", "/me/player/devices");
    for (const d of (j && j.devices) || []){
      if (!d.id) continue;
      const o = document.createElement("option");
      o.value = d.id; o.textContent = d.name + " (" + d.type + ")";
      sel.appendChild(o);
    }
  } catch(e){}
  const saved = store.get("device", "");
  sel.value = saved;
  if (sel.value !== saved) sel.value = "";
}

async function init(){
  CLIENT_ID = store.get("client_id", "");
  $("uri").textContent = REDIRECT_URI;
  $("saveCid").onclick = () => {
    const v = $("cid").value.trim();
    if (!/^[0-9a-f]{32}$/i.test(v)){ alert("Das sieht nicht nach einer Client ID aus (32 Zeichen)."); return; }
    store.set("client_id", v);
    location.reload();
  };
  $("resetCid").onclick = $("resetCid2").onclick = () => {
    if (!confirm("Client ID und Login zurücksetzen?")) return;
    ["client_id", "access", "refresh", "expires", "device"].forEach(store.del);
    location.reload();
  };
  if (!CLIENT_ID){
    $("setup").hidden = false;
    setStatus("Einrichtung");
    return;
  }

  const q = new URLSearchParams(location.search);
  let msg = "";
  if (q.get("code") || q.get("error")){
    if (q.get("error")) msg = "Spotify meldet: " + q.get("error");
    else if (!store.get("verifier", "")) msg = "Login-Daten fehlen: Seite direkt in Chrome/Safari öffnen und nochmal verbinden";
    else {
      try { await tokenRequest({grant_type: "authorization_code", code: q.get("code"),
                                redirect_uri: REDIRECT_URI, code_verifier: store.get("verifier", "")}); }
      catch(e){ msg = "Login fehlgeschlagen: " + e.message; }
    }
    const pending = store.get("pending", "");
    store.del("pending");
    history.replaceState(null, "", location.pathname + pending);
  }

  $("mode").value  = store.get("mode", "random");
  $("clip").value  = store.get("clip", "30");
  $("mode").onchange   = e => store.set("mode", e.target.value);
  $("clip").onchange   = e => store.set("clip", e.target.value);
  $("device").onchange = e => store.set("device", e.target.value);
  $("refresh").onclick = loadDevices;
  $("loginBtn").onclick = login;
  $("again").onclick  = () => play(current && current.lastPos).catch(showError);
  $("other").onclick  = () => play(randomPos(current.duration, +store.get("clip", "30") || 0)).catch(showError);
  $("stop").onclick   = () => { clearTimeout(stopTimer); api("PUT", "/me/player/pause").then(() => setStatus("⏹ Gestoppt")).catch(showError); };
  $("reveal").onclick = () => {
    if (!current || !current.info) return;
    const i = current.info;
    $("solution").textContent = i.artists.map(a => a.name).join(", ") + " – " + i.name +
      " (Spotify: " + (i.album.release_date || "").slice(0, 4) + ", Jahr auf der Karte gilt)";
  };

  if (!(await getToken())){
    $("login").hidden = false;
    setStatus(msg || (location.hash ? "Erst mit Spotify verbinden" : "Willkommen!"));
    return;
  }
  $("settings").hidden = false;
  loadDevices();

  const m = location.hash.match(/^#([A-Za-z0-9]{22})(?:@(\d+))?/);
  if (!m){ setStatus("Karte mit der Handykamera scannen"); return; }
  current = {id: m[1], start: m[2] ? +m[2] : null};
  $("controls").hidden = false;
  play().catch(showError);
}

window.addEventListener("hashchange", () => location.reload());
init();
</script>
</body>
</html>
